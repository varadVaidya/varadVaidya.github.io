{{ define "main" }}
<article class="home">
  <div class="profile-section">
    {{ with .Params.image }}
    <img src="{{ . }}" alt="{{ $.Site.Params.author }}" class="profile-image">
    {{ end }}
    <div class="profile-info">
      <h1>{{ .Site.Params.author }}</h1>
      {{ with .Params.subtitle }}<p class="subtitle">{{ . }}</p>{{ end }}
    </div>
  </div>

  <div class="content">
    {{ .Content }}
  </div>

  {{ if .Params.show_news }}
  <section class="news-section">
    <h2>News</h2>
    <ul class="news-list">
      {{ range .Params.news }}
      <li>
        <span class="news-date">{{ .date }}</span>
        <span class="news-text">{{ .text | markdownify }}</span>
      </li>
      {{ end }}
    </ul>
  </section>
  {{ end }}
</article>
{{ end }}
